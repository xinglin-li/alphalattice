repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check --config pyproject.toml
        language: system
        types: [file]
        require_serial: true
        stages: [manual]
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format --check --config pyproject.toml
        language: system
        types: [file]
        require_serial: true
        stages: [manual]
      - id: strict-mypy
        name: strict mypy
        entry: python scripts/check_playpen.py --strict-mypy-only
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: check-added-large-files
        name: check added large files
        entry: python -m pre_commit_hooks.check_added_large_files
        language: system
        stages: [manual]
      - id: check-merge-conflict
        name: check merge conflicts
        entry: python -m pre_commit_hooks.check_merge_conflict
        language: system
        args: [--assume-in-merge]
        stages: [manual]
      - id: gitleaks
        name: scan staged changes for secrets and private keys
        entry: python scripts/run_playpen_precommit.py --secrets
        language: system
        always_run: true
        require_serial: true
      # The hook runs every guard check outside COMMIT_STAGE_ONLY (test-shape and
      # test-budget among them) within its budget; the commit stage runs only the
      # rest, and the composed merge runs all (scripts/check_playpen.py).
      - id: playpen-fast-guard
        name: playpen fast guard (changed files)
        entry: python scripts/check_playpen.py --staged --fast --hook
        language: system
        pass_filenames: false
