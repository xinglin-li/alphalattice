  - id: poll-without-deadline
    message: >-
      A polling loop (a while that waits between checks) with no monotonic deadline can wait for good. Bound it by
      time.monotonic().
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: |
          while $C:
              ...
      - pattern-not: |
          while True:
              ...
      - pattern-either:
          - pattern: |
              while $C:
                  ...
                  <... time.sleep(...) ...>
                  ...
          - pattern: |
              while $C:
                  ...
                  <... $E.wait($I) ...>
                  ...
      - pattern-not: |
          while <... time.monotonic() ...>:
              ...
      - pattern-not: |
          while $C:
              ...
              <... time.monotonic() ...>
              ...
      - pattern-not: |
          while <... $E.is_set() ...>:
              ...
      - pattern-not: |
          while not $E.wait($I):
              ...
  - id: busy-wait
    message: >-
      A loop that only re-checks its condition spins a CPU until it changes. Use a bounded wait.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: |
          while $C:
              pass
      - pattern: |
          while $C:
              continue
  - id: retry-without-bound
    message: >-
      A retry over itertools.count() has no attempt or time bound. Bound its attempts.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: |
          for $I in itertools.count(...):
              ...
      - pattern-not: |
          for $I in itertools.count(...):
              ...
              <... time.monotonic() ...>
              ...
  - id: wall-clock-deadline
    message: >-
      time.time() moves with the wall clock, so a deadline on it can end early or never. Use time.monotonic().
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: time.time() + $X
      - pattern: time.time() < $X
      - pattern: time.time() <= $X
      - pattern: time.time() > $X
      - pattern: time.time() >= $X
      - pattern: $X < time.time()
      - pattern: $X <= time.time()
      - pattern: $X > time.time()
      - pattern: $X >= time.time()
      - pattern: $X - time.time()
  - id: deadline-reset-in-loop
    message: >-
      A deadline set again on every pass of the loop it bounds never arrives. Set it once, before the loop.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: |
          while <... $D ...>:
              ...
              $D = time.monotonic() + $T
              ...
      - pattern: |
          while True:
              ...
              $D = time.monotonic() + $T
              ...
              if <... $D ...>:
                  ...
              ...
      - pattern: |
          while True:
              ...
              if <... $D ...>:
                  ...
              ...
              $D = time.monotonic() + $T
              ...
  - id: blocking-under-lock
    message: >-
      A sleep or blocking call while a lock is held stalls every other holder for its whole length. Release the lock
      first, or bound the call and keep it short.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-inside: |
          with $L:
              ...
      - metavariable-regex:
          metavariable: $L
          regex: (?i).*(lock|mutex).*
      - pattern-either:
          - pattern: time.sleep(...)
          - pattern: subprocess.$F(...)
          - pattern: wk.core.spawn.run(...)
          - pattern: $X.wait(...)
          - pattern: $X.join()
          - pattern: $X.result(...)
          - pattern: urllib.request.urlopen(...)
