                  ...
                  raise ...
              ...
      - pattern-not: |
          while True:
              ...
              if <... clock() ...>:
                  ...
                  raise $R from $F
              ...
      - pattern-not: |
          while True:
              ...
              if <... deadline ...>:
                  ...
                  break
              ...
      - pattern-not: |
          while True:
              ...
