              ...
              if <... $E.is_set() ...>:
                  ...
                  raise
              ...
      - pattern-not: |
          while True:
              ...
              if <... $E.is_set() ...>:
                  ...
                  raise ...
              ...
      - pattern-not: |
          while True:
              ...
              if <... $E.is_set() ...>:
                  ...
                  raise $R from $F
              ...
      - pattern-not: |
          while True:
