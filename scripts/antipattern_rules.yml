                  ...
                  raise $R from $F
              ...
      - pattern-not: |
          while True:
              ...
              if <... $E.is_set() ...>:
                  ...
                  break
              ...
      - pattern-not: |
          while True:
              ...
              if <... $E.is_set() ...>:
                  ...
                  return ...
              ...
      - pattern-not: |
