rules:
  - id: child-without-no-window
    message: >-
      A child launched without creationflags opens a visible console on Windows. Use the product's
      process owner or pass creationflags=CREATE_NO_WINDOW.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - patterns:
              - pattern: subprocess.$F(...)
              - pattern-not: subprocess.$F(..., creationflags=$FLAGS, ...)
          - pattern: subprocess.$F(..., creationflags=0, ...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(run|Popen|call|check_call|check_output)$
      # unpacked options carry the flags only where the same scope visibly sets them
      - pattern-not-inside: |
          $O = {..., "creationflags": $X, ...}
          ...
          subprocess.$F(..., **$O, ...)
      - pattern-not-inside: |
          $O = dict(..., creationflags=$X, ...)
          ...
          subprocess.$F(..., **$O, ...)
      - pattern-not-inside: |
          $O.setdefault("creationflags", $X)
          ...
          subprocess.$F(..., **$O, ...)
  - id: walk-without-onerror
    message: >-
      os.walk skips unreadable directories silently, so a count, copy or deletion can pass on part of a tree.
      Pass onerror= that raises, or record each error by name.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: os.walk(...)
      - pattern-not: os.walk(..., onerror=$HANDLER, ...)
  - id: glob-suppresses-oserror
    message: >-
      Path.glob, Path.rglob and glob.glob suppress OSError from scandir (Python 3.12), so an unreadable directory
      reads as empty. Enumerate with os.scandir and refuse unreadable entries by name.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: $P.glob(...)
      - pattern: $P.rglob(...)
      - pattern: $P.iglob(...)
  - id: call-without-timeout
    message: >-
      A blocking call without a timeout can hang its caller for good. Pass a finite timeout (never None).
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-not-inside: asyncio.create_task(...)
      - pattern-either:
        - patterns:
            - pattern: subprocess.$F(...)
            - metavariable-regex:
                metavariable: $F
                regex: ^(run|call|check_call|check_output)$
            - pattern-not: subprocess.$F(..., timeout=$T, ...)
        - patterns:
            - pattern: wk.core.spawn.run(...)
            - pattern-not: wk.core.spawn.run(..., timeout=$T, ...)
        - patterns:
            - pattern: $P.communicate(...)
            - pattern-not: $P.communicate(..., timeout=$T, ...)
            - pattern-not: $P.communicate($A, $B)
            - pattern-not-inside: |
                $P.kill()
                ...
        - patterns:
            - pattern: $P.wait()
            - pattern-not-inside: |
                $P.kill()
                ...
        - pattern: $T.join()
        - patterns:
            - pattern: $Q.get()
            - metavariable-regex:
                metavariable: $Q
                regex: ^(?!_?[A-Z][A-Z0-9_]*$).*
        - pattern: $Q.get(True)
        - pattern: $Q.get(block=True)
        - pattern: $L.acquire()
        - pattern: $L.acquire(True)
        - pattern: $L.acquire(blocking=True)
        - patterns:
            - pattern-inside: |
                $F = $E.submit(...)
                ...
            - pattern: $F.result()
            - pattern-not-inside: $F.done() and $X
            - pattern-not-inside: |
                if $F.done():
                    ...
        - patterns:
            - pattern-either:
                - pattern: urllib.request.urlopen($U)
                - pattern: urllib.request.urlopen($U, $D)
                - pattern: urllib.request.urlopen($U, data=$D)
        - pattern: socket.create_connection($A)
        - pattern: $F(..., timeout=None, ...)
  - id: while-true-without-deadline
    message: >-
      A while True loop with no monotonic deadline or stop event can spin or hang for good, and a thread looping so
      can never be ended. Bound it by time.monotonic() or loop a thread on `while not stop.wait(interval)`.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: |
          while True:
              ...
      # exempt only where a bound or stop check ends the loop (directly, or through a variable it
      # sets from the bound): a mention of a clock is not a bound
      - pattern-not: |
          while True:
              ...
              if <... time.monotonic() ...>:
                  ...
                  break
              ...
      - pattern-not: |
          while True:
              ...
              if <... time.monotonic() ...>:
                  ...
                  return ...
              ...
      - pattern-not: |
          while True:
              ...
              if <... time.monotonic() ...>:
                  ...
                  raise
              ...
      - pattern-not: |
          while True:
              ...
              if <... time.monotonic() ...>:
                  ...
                  raise ...
              ...
      - pattern-not: |
          while True:
              ...
              if <... time.monotonic() ...>:
                  ...
                  raise $R from $F
              ...
      - pattern-not: |
          while True:
              ...
              if <... clock() ...>:
                  ...
                  break
              ...
      - pattern-not: |
          while True:
              ...
              if <... clock() ...>:
                  ...
                  return ...
              ...
      - pattern-not: |
          while True:
