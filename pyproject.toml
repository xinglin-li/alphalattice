# This workspace owns its own dependency declaration and lock. `uv.lock` beside
# this file is the only resolution authority; no parent project, lock, or
# interpreter is consulted. uv installs the src-layout project editable;
# source edits are live without rebuilding a distribution.
#
# Bootstrap once per worktree (dev group is default; `--offline` uses the local
# uv cache only and an absent cache is a stop, never a fetch):
#
#     uv sync --locked --all-extras
#
# Extras name the capability each dependency group serves. The full retained
# product needs all of them; a narrower environment is a deliberate choice.
[project]
name = "alphalattice"
version = "0.2.6"
description = "A local quantitative research workstation for Claude Code and Codex."
authors = [{ name = "Xinglin Li", email = "xinglin789@outlook.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Already locked; process telemetry is runtime, not only a test dependency.
    "psutil>=7,<8",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.1,<2",
    "pyyaml>=6.0,<7",
    # `protocols.actor_execution.projections` imports it at module load and is
    # reached by deterministic Factor and Evidence contracts.
    "tiktoken>=0.13,<1",
    "xxhash>=3.7,<4",
]

[project.scripts]
alphalattice = "alphalattice.control.product_host.composition.entry:main"

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["alphalattice*"]

[tool.setuptools.cmdclass]
build_py = "scripts.release.wheel_build.BuildPy"

[tool.setuptools.package-dir]
"" = "src"
scripts = "scripts"

[tool.setuptools.package-data]
alphalattice = ["**/*.json", "**/*.yaml", "**/*.yml", "**/*.toml", "**/*.md", "**/*.txt", "**/*.html", "**/*.css", "**/*.js", "**/*.woff2", "**/*.svg", "protocols/actor_execution/cl100k_base.tiktoken.gz"]

[project.optional-dependencies]
# Data Operations, Feature, Panel, and workspace storage.
data = [
    # Hold through 2026-12-12: 2.0 leaves query results open and refuses our registration;
    # migrate the connection owner and validate 2.0 storage/rollback compatibility first.
    "duckdb==1.5.6",
    "exchange-calendars>=4.13,<5",
    "numpy>=2.5,<3",
    "pandas>=3.0,<4",
    "pyarrow>=25,<26",
    "tzdata>=2026.3,<2027",
]
# Explicitly admitted live market acquisition; network stays off by default.
data-live = [
    "httpx>=0.28,<1",
    "yfinance>=1.5,<2",
]
# Explicitly admitted live evidence acquisition; network stays off by default.
live-evidence = [
    "httpx>=0.28,<1",
    # Hold through 2026-12-12: 2.3.1 changes canonical evidence bytes and escapes table notices;
    # lift after v6 byte compatibility is proved or an identity successor is approved.
    "trafilatura==2.1.0",
]
# Alpha, Risk, Sector, Portfolio, and Validation numerics.
quant = [
    "clarabel>=0.11,<1",
    "cvxpy-base>=1.9,<2",
    "joblib>=1.5,<2",
    "lightgbm>=4.7,<4.8",
    "numpy>=2.5,<3",
    "optuna>=5,<6",
    "osqp>=1.1,<2",
    "pandas>=3.0,<4",
    "pyarrow>=25,<26",
    "scikit-learn>=1.9,<2",
    "scipy>=1.18,<2",
    "statsmodels>=0.15,<0.16",
    "threadpoolctl>=3.6,<4",
]
# Pinned local semantic retrieval; the FastEmbed reranker closure stays in
# `config/requirements-retrieval.lock` and `scripts/create_retrieval_environment.py`.
semantic = [
    "numpy>=2.5,<3",
    "onnxruntime==1.27.0",
    "sentencepiece==0.2.1",
    "sqlite-vec==0.1.9",
]

[dependency-groups]
dev = [
    "ast-grep-cli==0.51.1",
    "deptry>=0.25,<1",
    "hypothesis>=6.140,<7",
    "import-linter>=2.15,<3",
    # The release gates' shared environment (devtools.evaluation) runs on Inspect AI's structure.
    "inspect-ai==0.3.288",
    # inspect-ai 0.3.288 imports acp.helpers, which agent-client-protocol 1.0.0 removed, and its own
    # requirement has no upper bound: hold below 1 until an Inspect AI release supports 1.x.
    "agent-client-protocol>=0.12,<1",
    # Preserve the product environment while the docs tools use mdformat's <4 range.
    "markdown-it-py==4.2.0",
    "mypy>=1.18,<2",
    "pandas-stubs>=3.0,<4",
    "pip-licenses>=5,<6",
    "portalocker>=3.2,<4",
    "pre-commit>=4.3,<5",
    "pre-commit-hooks>=5,<7",
    "py-spy>=0.4,<1",
    "pyinstrument>=5.1,<6",
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "pytest-socket>=0.7,<1",
    "pytest-split>=0.10,<1",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist==3.8.0",
    "ruff>=0.14,<1",
    "vulture>=2.16,<3",
    "semgrep==1.185.0",
    "shellcheck-py==0.11.0.1",
    "actionlint-py==1.7.12.25",
]
# Each package below registers a pytest plugin that loads itself into every pytest run in an
# environment it is installed in, so each stays out of the default dev group and in a group of
# its own; a run that uses one asks for it with --group.
# Seeded random test order, for the nightly walk.
order = [
    "pytest-randomly>=5,<6",
]
# Per-test CPU instruction counts on CodSpeed, for the public test-cost job.
codspeed = [
    "pytest-codspeed==5.0.4",
    "pytest-test-groups==1.2.1",
]
# The public supply-chain job: known vulnerabilities in the lock, and the release's CycloneDX SBOM.
supply-chain = [
    "cyclonedx-bom==7.6.0",
    "pip-audit==2.10.1",
]
docs = [
    "mkdocs-llmstxt>=0.5.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=2.0.9",
]
mutation = [
    "mutmut>=3,<4",
]

[tool.uv]
package = true
default-groups = ["dev"]
conflicts = [[{ group = "docs" }, { group = "dev" }]]
# semgrep 1.185.0 (its latest) pins packages with known vulnerabilities, and nothing else here needs them. Each
# override lifts one pin to its lowest fixed release; drop it once a semgrep release pins a fixed version itself.
# The opentelemetry family moves together: its other members follow these through their own exact pins.
override-dependencies = [
    "mcp>=1.30.0,<2",  # CVE-2026-59951, CVE-2026-116684, CVE-2026-116685, CVE-2026-116686
    "opentelemetry-api>=1.45.2,<2",  # CVE-2026-114603, CVE-2026-126360
    "opentelemetry-sdk>=1.45.2,<2",  # moves with opentelemetry-api, which it pins exactly
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2",  # moves with opentelemetry-sdk, which it pins
    "opentelemetry-instrumentation-requests>=0.66b2,<1",  # the 1.45.2 train's instrumentation
    "opentelemetry-instrumentation-threading>=0.66b2,<1",  # the 1.45.2 train's instrumentation
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts", "tests", "benchmark", "probe", "case-study"]
extend-exclude = ["experiments", "tmp", "workspaces"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# S113, ASYNC and DTZ005: blocking calls with no timeout and naive wall clocks (the wait rules
# in scripts/check_waits.py hold the rest); none existed when they came in.
extend-select = ["T20", "TID251", "S113", "ASYNC", "DTZ005"]

[tool.ruff.lint.per-file-ignores]
# Agent answers are product output; maintainers' tools own their diagnostics.
"!src/alphalattice/**" = ["T20", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sys.stdout" = { msg = "Write through the output owner" }
"sys.stderr" = { msg = "Write through the output owner or a named stderr exemption" }

[tool.ruff.format]
line-ending = "lf"

[tool.vulture]
# Names an interface requires but its implementer does not read; vulture's 100% findings are false positives here.
ignore_names = [
    "exc_type", "exc_value", "traceback",  # context-manager protocol arguments (WorkspaceLock.__exit__)
    "chunk_published",  # progress protocol field, ignored by its one implementer (_FoldCancellation)
]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
explicit_package_bases = true
mypy_path = "src"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "duckdb",
    "duckdb.*",
    "pyarrow",
    "pyarrow.*",
    "sklearn",
    "sklearn.*",
    "statsmodels",
    "statsmodels.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
tmp_path_retention_policy = "failed"
tmp_path_retention_count = "1"
# `-p no:cacheprovider`: the gate never uses `--lf`/`--ff`, and a `.pytest_cache`
# written under another security context made every run print a read-only
# cache warning that had to be read past to find the real output.
addopts = "--strict-config --strict-markers -p no:cacheprovider"
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
markers = [
    "private_data: the test writes its seed's market data or Parquet, so it gets a private copy",
    "small: registered in-memory test size; resource enforcement follows",
    "medium: registered local integration test size",
    "large: registered workflow or expensive test size; candidate and nightly obligation",
    "proves: the registered requirement ids (config/registries/requirements.json) this test proves; find before writing one: python scripts/tests_registry.py find",
    "untyped_failure: the test makes an operation fail without a product code on purpose; the answer check lets it pass (V449)",
    "per_file: a structural scan scoped to the changed files; it reads source only through scanned()",
    "real_evidence: reads a dogfood evidence root declared in the private evidence-root registry; deselected by the routed gate and run explicitly by scripts/check_playpen.py --evidence",
]
