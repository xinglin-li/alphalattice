# The installed Dynamic Panel LightGBM model (EX). Its reference recipe is the product's current
# one: `product_recipe.IW184_ESTIMATOR_POINT` at the first IW184 seed. The axes are the space a
# search proposes from (V309); they stay inside the adapter's domain, and `max_depth` starts at 5
# so every `num_leaves` on its axis is admitted (at most 2 ** max_depth). The seed is replication,
# not search. This wave the declaration enters no identity.
model_id: dynamic_panel_lightgbm
family: gradient_boosted_trees
fit_protocol: DIRECT_FIT
parameters:
  seed: int
  num_leaves: int
  learning_rate: float
  max_depth: int
  min_child_samples: int
  lambda_l1: float
  lambda_l2: float
  min_gain_to_split: float
  feature_fraction: float
  bagging_fraction: float
  bagging_freq: int
  training_policy: str
  fixed_iterations: int
recipe:
  seed: 1729
  num_leaves: 31
  learning_rate: 0.05
  max_depth: 5
  min_child_samples: 50
  lambda_l1: 10.0
  lambda_l2: 100.0
  min_gain_to_split: 0.01
  feature_fraction: 0.7
  bagging_fraction: 0.7
  bagging_freq: 1
  training_policy: FIXED_ITERATION
  fixed_iterations: 300
search:
  axes:
    - {name: training_policy, kind: categorical, choices: [FIXED_ITERATION, L2_EARLY_STOPPING, SESSION_RANK_IC_EARLY_STOPPING], default: FIXED_ITERATION}
    - {name: fixed_iterations, kind: int, low: 50, high: 500, step: 25, default: 300, when: {axis: training_policy, in: [FIXED_ITERATION]}}
    - {name: learning_rate, kind: float, low: 0.01, high: 0.2, log: true, default: 0.05}
    - {name: max_depth, kind: int, low: 5, high: 8, default: 5}
    - {name: num_leaves, kind: int, low: 8, high: 32, log: true, default: 31}
    - {name: min_child_samples, kind: int, low: 20, high: 500, log: true, default: 50}
    - {name: lambda_l1, kind: float, low: 0.0, high: 100.0, default: 10.0}
    - {name: lambda_l2, kind: float, low: 0.0, high: 1000.0, default: 100.0}
    - {name: min_gain_to_split, kind: float, low: 0.0, high: 0.1, default: 0.01}
    - {name: feature_fraction, kind: float, low: 0.5, high: 1.0, default: 0.7}
    - {name: bagging_fraction, kind: float, low: 0.5, high: 1.0, default: 0.7}
    - {name: bagging_freq, kind: int, low: 0, high: 5, default: 1}
