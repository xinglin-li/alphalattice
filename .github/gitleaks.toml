# The public secret scan: gitleaks' own rules, with one reviewed allowance for its generic-api-key rule.
# The allowance names exact values, never a shape or a line: a value is added here only after a review shows
# it is public content (a pinned digest, a constant's name, a test placeholder). Every other rule stays whole.
title = "AlphaLattice public secret scan"

[extend]
useDefault = true

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Reviewed non-secret values the generic rule reads as keys: SHA-256 pins of the semantic tokenizer files and the recorded demo, two constants' names, and the tests' sequential placeholder"
regexes = [
