name: Verify

# Both legs a person can install: the source checkout and the built wheel. Runs only in a public
# repository, for main and next and pull requests against either; actions are pinned to the commit
# of the named release. Every public test runs split over free runners once a night on next's tip
# (skipped when that commit already has a full run) and on workflow_dispatch for a promotion candidate;
# a push keeps the fast legs only.
on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"  # 07:17 UTC: 03:17 New York in summer, 02:17 in winter; after the next export

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}  # a push never cancels a full run
  cancel-in-progress: true

env:
  ALPHALATTICE_NETWORK_DISABLED: "1"

jobs:
  checkout:
    name: Source checkout
    if: ${{ !github.event.repository.private && github.event_name != 'schedule' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the locked environment
        run: uv sync --locked --all-extras
      - name: Build Local Web
        run: uv run python scripts/build_local_web_ui.py --product
      - name: Check Local Web freshness and syntax
        run: uv run python scripts/build_local_web_ui.py --product --check
      - name: Run the commit stage of config/pipeline.toml
        run: >-
          uv run python scripts/pipeline.py run commit --host public --base HEAD --workers 4
          --out "${{ runner.temp }}/pipeline"

  wheel:
    name: Installed wheel
    if: ${{ !github.event.repository.private && github.event_name != 'schedule' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the locked environment
        run: uv sync --locked --all-extras
      - name: Build Local Web
        run: uv run python scripts/build_local_web_ui.py --product
      - name: Build the wheel
        run: uv build --wheel --out-dir "${{ runner.temp }}/dist"
      - name: Install the wheel as the setup guide does
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-bin
        run: |
          $wheel = (Get-ChildItem "${{ runner.temp }}/dist/alphalattice-*-py3-none-any.whl").FullName
          $requirements = "${{ runner.temp }}/alphalattice-runtime-requirements.txt"
          uv run python -c "import sys, zipfile, pathlib; pathlib.Path(sys.argv[2]).write_bytes(zipfile.ZipFile(sys.argv[1]).read('alphalattice/_runtime/config/release/runtime-requirements.txt'))" $wheel $requirements
          uv tool install --python 3.12 $wheel --with-requirements $requirements --constraints $requirements
          "ALPHALATTICE_TEST_WHEEL=$wheel" >> $env:GITHUB_ENV
      - name: Smoke the installed command in fresh PowerShell and Git Bash
        shell: bash
        run: |
          temp="${RUNNER_TEMP//\\//}"
          for shell in powershell bash; do
            uv run python scripts/release/wheel_smoke.py --command "$temp/uv-bin/alphalattice.exe" --output "$temp/smoke-$shell.json" --fresh-shell "$shell"
          done
      - name: Run the wheel runtime tests
        run: >-
          uv run python -m pytest tests/release/test_wheel_runtime.py -n auto
          --basetemp "${{ runner.temp }}/alphalattice-wheel-tests"

  platforms:
    name: Offline first use (${{ matrix.os }})
    if: ${{ !github.event.repository.private && github.event_name != 'schedule' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Set isolated tool paths
        run: |
          temp="${RUNNER_TEMP//\\//}"
          printf 'UV_TOOL_DIR=%s/uv-tools\nUV_TOOL_BIN_DIR=%s/uv-bin\n' "$temp" "$temp" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the locked environment
        run: uv sync --locked --all-extras
      - name: Build Local Web
        run: uv run python scripts/build_local_web_ui.py --product
      - name: Install OpenMP on macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install the locked Workbench browser tooling
        working-directory: third_party/playwright
        env:
          PLAYWRIGHT_BROWSERS_PATH: .browsers
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          if [ "$RUNNER_OS" = Linux ]; then
            npx --no-install playwright install --with-deps chromium
          else
            npx --no-install playwright install chromium
          fi
      - name: Run the offline first-use scenario
        run: >-
          uv run python -m pytest
          tests/portfolio_strategy_lab/test_first_use_goal.py::test_a_first_use_decides_its_own_preparations_data_issue_and_its_preparation_goes_on
          -n 1 -m "not real_evidence"
          --basetemp "${{ runner.temp }}/alphalattice-first-use"
      - name: Build and install the wheel; smoke in fresh bash
        if: runner.os != 'Windows'
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          wheels=("$RUNNER_TEMP"/dist/alphalattice-*-py3-none-any.whl)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          requirements="$RUNNER_TEMP/alphalattice-runtime-requirements.txt"
          uv run python -c "import sys, zipfile, pathlib; pathlib.Path(sys.argv[2]).write_bytes(zipfile.ZipFile(sys.argv[1]).read('alphalattice/_runtime/config/release/runtime-requirements.txt'))" "$wheel" "$requirements"
          uv tool install --python 3.12 "$wheel" --with-requirements "$requirements" --constraints "$requirements"
          uv run python scripts/release/wheel_smoke.py --command "$UV_TOOL_BIN_DIR/alphalattice" --output "$RUNNER_TEMP/smoke-bash.json" --fresh-shell bash

  public-tests-plan:
    name: Plan the public tests
    if: ${{ !github.event.repository.private && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      run: ${{ steps.plan.outputs.run }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Pick the commit; a nightly skips one that already has a full run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.event_name == 'schedule' && 'next' || github.sha }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
          done=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=public-tests-$sha" --jq '[.artifacts[] | select(.expired | not)] | length')
          run=true
          if [ "$EVENT" = schedule ] && [ "$done" != 0 ]; then run=false; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          # The shard list, once: the fewest shards that keep the wall under 30 min, from measured runs.
          echo 'shards=[1, 2, 3, 4]' >> "$GITHUB_OUTPUT"
          echo "public tests at $sha: run=$run; earlier full runs of it: $done"

  public-tests-shard:
    name: Public tests (shard ${{ matrix.group }})
    needs: public-tests-plan
    if: ${{ needs.public-tests-plan.outputs.run == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.public-tests-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.public-tests-plan.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the locked environment
        run: uv sync --locked --all-extras
      - name: Build Local Web
        run: uv run python scripts/build_local_web_ui.py --product
      - name: Install the locked Workbench browser tooling
        shell: bash
        working-directory: third_party/playwright
        env:
          PLAYWRIGHT_BROWSERS_PATH: .browsers
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Run this shard of every public test
        # Collected at run time, never a file list: pytest-split gives a test missing from .test_durations the average.
        run: >-
          uv run python -m pytest tests -m "not real_evidence" -n 4
          --splits ${{ strategy.job-total }} --group ${{ matrix.group }} --durations-path .test_durations
          --junitxml "${{ runner.temp }}/junit.xml" --basetemp "${{ runner.temp }}/alphalattice-public-tests"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-tests-junit-${{ matrix.group }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: error  # a shard without its JUnit has not proved it ran
          retention-days: 14

  public-tests:
    name: Public tests
    needs: [public-tests-plan, public-tests-shard]
    if: ${{ always() && needs.public-tests-plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.public-tests-plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: public-tests-junit-*
          path: ${{ runner.temp }}/junit
      - name: Total the shards and refresh the durations from their JUnit
        run: >-
          python3 scripts/release/test_durations.py "$RUNNER_TEMP/.test_durations" "$RUNNER_TEMP"/junit/*/junit.xml
          --summary "$RUNNER_TEMP/public-tests.json"
          --expect ${{ join(fromJSON(needs.public-tests-plan.outputs.shards), ' ') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()  # this run's totals, whatever the shards did
        with:
          name: public-tests-summary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public-tests.json
            ${{ runner.temp }}/.test_durations
          include-hidden-files: true
      - name: Every shard passed
        run: test "${{ needs.public-tests-shard.result }}" = success
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # The next nightly skips on this marker only after every shard passes; the release record reads this job.
        if: success() && needs.public-tests-shard.result == 'success'
        with:
          name: public-tests-${{ needs.public-tests-plan.outputs.sha }}
          path: ${{ runner.temp }}/public-tests.json
